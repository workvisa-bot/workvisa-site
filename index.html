<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkVisaUnit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #1e1e2f;
      overflow-x: hidden;
      color: white;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .navbar {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
      display: flex;
      gap: 20px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .navbar a:hover {
      opacity: 0.7;
    }

    .form-box {
      background: #2c2f3f;
      padding: 1rem;
      border-radius: 8px;
      max-width: 300px;
      position: absolute;
      top: 60px;
      z-index: 2;
      display: none;
    }

    .form-box h3 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #fff;
    }

    .form-box input,
    .form-box textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 4px;
    }

    .form-box button {
      width: 100%;
      padding: 0.75rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-top: 1rem;
      animation: fadeInDown 1s ease forwards;
    }

    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div class="navbar">
    <a id="langToggle" onclick="toggleLanguage()">EN</a>
    <a onclick="toggleDetails()" lang="ru">Подробнее</a>
    <a onclick="toggleDetails()" lang="en" style="display: none;">Details</a>
    <a onclick="toggleContact()" lang="ru">Контакт</a>
    <a onclick="toggleContact()" lang="en" style="display: none;">Contact</a>
    <a onclick="toggleForm()" lang="ru">Оставь заявку</a>
    <a onclick="toggleForm()" lang="en" style="display: none;">Submit</a>
  </div>

  <div class="form-box" id="formBox" style="right: 30px;">
    <h3 lang="ru">Оставь заявку</h3>
    <h3 lang="en" style="display: none;">Submit a Request</h3>
    <form action="https://formspree.io/f/mldnrjvp" method="POST">
      <input type="text" name="name" placeholder="Ваше имя / Your Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" rows="3" placeholder="Сообщение / Message"></textarea>
      <button type="submit" lang="ru">Отправить</button>
      <button type="submit" lang="en" style="display: none;">Submit</button>
    </form>
  </div>

  <div class="form-box" id="contactBox" style="right: 340px;">
    <h3 lang="ru">Контакт</h3>
    <h3 lang="en" style="display: none;">Contact</h3>
    <p>Email: <a href="mailto:workvisa.unit@gmail.com" style="color: #aad4ff">workvisa.unit@gmail.com</a></p>
  </div>

  <div class="form-box" id="detailsBox" style="right: 650px; max-width: 400px;">
    <!-- Content unchanged for brevity -->
  </div>

  <div class="content">
    <h1 lang="ru">WorkVisaUnit</h1>
    <h1 lang="en" style="display: none;">WorkVisaUnit</h1>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    window.currentLang = window.currentLang || 'ru';

    function toggleLanguage() {
      const ruElements = document.querySelectorAll('[lang="ru"]');
      const enElements = document.querySelectorAll('[lang="en"]');
      const langToggle = document.getElementById("langToggle");

      if (currentLang === 'ru') {
        ruElements.forEach(el => el.style.display = 'none');
        enElements.forEach(el => el.style.display = '');
        currentLang = 'en';
        langToggle.innerText = 'RU';
      } else {
        enElements.forEach(el => el.style.display = 'none');
        ruElements.forEach(el => el.style.display = '');
        currentLang = 'ru';
        langToggle.innerText = 'EN';
      }
    }

    function toggleForm() {
      const formBox = document.getElementById("formBox");
      formBox.style.display = (formBox.style.display === "block") ? "none" : "block";
    }

    function toggleContact() {
      const contactBox = document.getElementById("contactBox");
      contactBox.style.display = (contactBox.style.display === "block") ? "none" : "block";
    }

    function toggleDetails() {
      const detailsBox = document.getElementById("detailsBox");
      detailsBox.style.display = (detailsBox.style.display === "block") ? "none" : "block";
    }

    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: false },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 2,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
